name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Alire and GNAT toolchain
        uses: alire-project/setup-alire@v6
        with:
          toolchain: 'gnat_native gprbuild'

      - name: Build root programs
        run: alr --non-interactive build

      - name: Build HuntTheWumpus
        working-directory: HuntTheWumpus
        run: alr --non-interactive build
